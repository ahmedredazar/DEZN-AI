<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>DEZN AI</title>

  <link rel="icon" href="./assets/dezn.png" />

  <link
    rel="stylesheet"
    href="./assets/style.css"
  />
</head>

<body>

  <div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

      <div class="brand">
        <img
          src="./assets/dezn.png"
          alt="DEZN"
        />

        <div>
          <strong>DEZN</strong>
          <span>AI</span>
        </div>
      </div>


      <button
        id="newChat"
        class="new-chat"
        type="button"
      >
        ＋ New Chat
      </button>


      <div class="history-title">
        RECENT CHATS
      </div>


      <div
        id="history"
        class="history"
      ></div>


      <div class="sidebar-bottom">

        <div class="status">
          <i></i>
          DEZN AI Online
        </div>

      </div>

    </aside>


    <!-- MAIN -->
    <main class="main">

      <!-- TOP BAR -->
      <header class="topbar">

        <div class="mobile-brand">

          <img
            src="./assets/dezn.png"
            alt="DEZN"
          />

          <span>DEZN AI</span>

        </div>


        <button
          id="clearChat"
          class="icon-btn"
          type="button"
          title="Clear chat"
          aria-label="Clear chat"
        >
          ⌫
        </button>

      </header>


      <!-- CHAT -->
      <section
        id="chat"
        class="chat"
      >

        <div
          id="welcome"
          class="welcome"
        >

          <div class="logo-large">

            <img
              src="./assets/dezn.png"
              alt="DEZN"
            />

          </div>


          <h1>
            DEZN AI
          </h1>


          <p>
            Your intelligent assistant, built for DEZN.
          </p>


          <div class="suggestions">

            <button
              type="button"
              data-prompt="Help me build a modern website"
            >
              Build a website
            </button>


            <button
              type="button"
              data-prompt="Explain this concept simply"
            >
              Explain something
            </button>


            <button
              type="button"
              data-prompt="Give me creative ideas for my project"
            >
              Creative ideas
            </button>


            <button
              type="button"
              data-prompt="Help me write professional content"
            >
              Write content
            </button>

          </div>

        </div>

      </section>


      <!-- MESSAGE INPUT -->
      <form
        id="composer"
        class="composer"
      >

        <textarea
          id="input"
          rows="1"
          placeholder="Message DEZN AI..."
          autocomplete="off"
          aria-label="Message DEZN AI"
        ></textarea>


        <button
          id="send"
          type="submit"
          aria-label="Send message"
        >
          ➤
        </button>

      </form>


      <!-- DISCLAIMER -->
      <div class="disclaimer">
        DEZN AI can make mistakes. Check important information.
      </div>

    </main>

  </div>


  <!-- JAVASCRIPT -->
  <script src="./assets/app.js"></script>

</body>
</html>
